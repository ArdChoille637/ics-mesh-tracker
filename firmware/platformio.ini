; ICS mesh tracker firmware — one codebase, three build environments (one
; per role). Flash `field` to 2 boards, `team_lead` to 1, `gateway` to 1
; for the initial 4-board fleet (see ../README.md for the full BOM and
; flashing walkthrough).
;
; TEAM_ID lets you scale later: change it per-environment (or per-board via
; a second team_lead2/field3 env) when you have more than one strike team
; in the field at once — nodes only auto-discover an uplink within their
; own team_id (see EspNowMesh::discoveredUplink in mesh/espnow_mesh.cpp).

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
lib_deps =
	h2zero/NimBLE-Arduino @ ^2.1.0
build_flags =
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DTEAM_ID=1
board_build.filesystem = littlefs

[env:field]
build_flags =
	${env.build_flags}
	-DNODE_ROLE=FIELD

[env:team_lead]
build_flags =
	${env.build_flags}
	-DNODE_ROLE=TEAM_LEAD

[env:gateway]
build_flags =
	${env.build_flags}
	-DNODE_ROLE=GATEWAY

[env:field_nano_esp32]
board = arduino_nano_esp32
upload_protocol = esptool
build_flags =
	${env.build_flags}
	-DNODE_ROLE=FIELD
